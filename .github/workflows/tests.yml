name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install pytest-homeassistant-custom-component bleak bleak-retry-connector \
            aiousbwatcher bluetooth-adapters bluetooth-auto-recovery bluetooth-data-tools \
            dbus-fast habluetooth pyserial
      - name: Run tests
        run: pytest -q
